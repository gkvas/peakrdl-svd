[build-system]
requires = ["setuptools >= 61"]
build-backend = "setuptools.build_meta"

[project]
name = "peakrdl-svd"
version = "0.1.0"
description = "PeakRDL importer plugin for CMSIS-SVD register description files"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Gernot Kvas", email = "gernot@kvas.at"},
]
keywords = ["peakrdl", "svd", "cmsis", "register", "systemrdl", "importer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
requires-python = ">=3.8"
dependencies = [
    "systemrdl-compiler >= 1.30",
    "peakrdl >= 1.0",
]

[project.urls]
Homepage = "https://github.com/gkvas/peakrdl-svd"
Repository = "https://github.com/gkvas/peakrdl-svd"
Issues = "https://github.com/gkvas/peakrdl-svd/issues"

[project.entry-points."peakrdl.importers"]
svd = "peakrdl_svd.__peakrdl__:Importer"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
